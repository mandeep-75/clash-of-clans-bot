[project]
name = "clash-of-clans-bot"
version = "0.1.0"
description = "Automated Clash of Clans bot using OpenCV and OCR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "easyocr",
    "numpy",
    "Pillow",
    "flask",
]

[project.scripts]
coc-bot = "main:main_entry"
match-tool = "match_tool.app:main"

[dependency-groups]
dev = [
    "ruff",
    "black",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["match_tool"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true